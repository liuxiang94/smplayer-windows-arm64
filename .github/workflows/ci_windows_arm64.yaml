name: Build for Windows ARM64

on:
  push:

jobs:
  build-windows-arm64:
    name: Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup devcmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Install build tools
        run: |
          choco install jom sliksvn

      - name: Setup a new (or from cache) vcpkg (and does not build any package)
        uses: lukka/run-vcpkg@v11 # Always specify the specific _version_ of the
                                  # action you need, `v11` in this case to stay up
                                  # to date with fixes on the v11 branch
        with:
          vcpkgGitCommitId: '9e593bb18ea69cc5095e012465dcd675a822ed0d'

      - name: Install dependencies from vcpkg
        run: |
          # clear buildtrees after each package installation to reduce disk space requirements
          Add-Content `
            "${{ env.RUNVCPKG_VCPKG_ROOT }}/triplets/arm64-windows.cmake" `
            -Value "set(VCPKG_BUILD_TYPE release)"
          ${{ env.RUNVCPKG_VCPKG_ROOT }}/vcpkg.exe upgrade `
            --no-dry-run
          ${{ env.RUNVCPKG_VCPKG_ROOT }}/vcpkg.exe install `
            --clean-after-build `
            --triplet=arm64-windows --host-triplet=x64-windows-release `
            --x-buildtrees-root=C:\b
          cd "${{ github.workspace }}\vcpkg_installed\arm64-windows\lib"
          cp z.lib zlib.lib
          
      - name: Install Smplayer
        run: |
          $qt_install_dir = "${{ env.qt_path }}"
          $vcpkg_dir = "${{ github.workspace }}\vcpkg_installed"
          ./build.ps1  

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: p7zip mingw-w64-ucrt-x86_64-ntldd

      - name: copy dlls in MSYS2
        shell: msys2 {0}
        run: |       
          cd smplayer-portable
          ntldd -R --search-dir ../vcpkg_installed/arm64-windows/bin smplayer.exe | awk '{print $3}'| grep vcpkg  | sed 's|\\|/|g' | xargs -I{} cp -u {} .
          cd ..
          7z a -mx9 texlive-windows-arm64.zip smplayer-portable
          mkdir upload 
          mv smplayer-portable upload

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smplayer_arm64
          path: upload

      - name: Batch release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: smplayer-portable-*.zip
